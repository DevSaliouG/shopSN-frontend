<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="150" fill="#F97316" opacity="0.05"/>
  <circle cx="1100" cy="530" r="200" fill="#F97316" opacity="0.05"/>

  <!-- Logo placeholder (orange cart icon) -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="url(#accent)"/>
    <path d="M 30 40 L 40 40 L 50 70 L 80 70 L 90 40 L 100 40" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="55" cy="85" r="5" fill="white"/>
    <circle cx="75" cy="85" r="5" fill="white"/>
  </g>

  <!-- Brand name -->
  <text x="250" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">
    Dkr<tspan fill="#F97316">OnlineStore</tspan>
  </text>

  <!-- Tagline -->
  <text x="250" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#D1D5DB">
    Boutique en ligne — Dakar, Sénégal
  </text>

  <!-- Features -->
  <g transform="translate(250, 380)">
    <!-- WhatsApp -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9CA3AF">
      ✓ Commande via WhatsApp
    </text>
    <!-- Payment -->
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9CA3AF">
      ✓ Orange Money / Wave
    </text>
    <!-- Delivery -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9CA3AF">
      ✓ Livraison rapide Dakar
    </text>
  </g>

  <!-- Phone number -->
  <text x="1050" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#F97316" text-anchor="end">
    +221 78 783 80 02
  </text>
</svg>
