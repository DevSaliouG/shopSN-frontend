<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6600" />
    <meta
      name="description"
      content="OnlineStore - Boutique en ligne au Senegal. Decouvrez des centaines de produits et commandez facilement via WhatsApp. Livraison rapide a Dakar."
    />
    <meta
      name="keywords"
      content="e-commerce, Senegal, boutique en ligne, WhatsApp, produits, shopping, Dakar"
    />
    <meta name="author" content="OnlineStore" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OnlineStore" />
    <meta property="og:locale" content="fr_FR" />

    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    connect-src 'self' http://localhost:8000 http://api.onlinestore.sn https://api.onlinestore.sn ws://localhost:4200 ws://localhost:8000;
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: blob: http://localhost:8000 https://api.onlinestore.sn https://*.cloudinary.com https://res.cloudinary.com;
    media-src 'self';
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  "
    />

    <link rel="icon" type="image/x-icon" href="logo.jpeg" />
    <link rel="canonical" href="https://onlinestore.sn/" />

    <!-- Police Inter auto-hébergée via styles.css — aucun CDN externe -->

    <title>OnlineStore - Boutique en ligne Senegal</title>
  </head>

    <app-root></app-root>
  </body>
