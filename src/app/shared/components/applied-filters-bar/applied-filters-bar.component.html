@if (filters().length > 0) {
  <div class="applied-filters-bar" @filterAnimation>
    <span class="applied-label">Filtres actifs:</span>

    @for (filter of filters(); track filter.key) {
      <button
        type="button"
        class="filter-pill"
        (click)="onRemoveFilter(filter.key)"
        [attr.aria-label]="'Retirer le filtre ' + filter.label"
        @filterAnimation
      >
        <span class="filter-pill-label">{{ filter.label }}</span>
        <svg class="filter-pill-close" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    }

    <button
      type="button"
      class="clear-all-btn"
      (click)="onClearAll()"
      aria-label="Effacer tous les filtres"
    >
      Tout effacer
    </button>
  </div>
}
