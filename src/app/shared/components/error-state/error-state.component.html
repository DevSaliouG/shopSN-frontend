<div class="error-state">
  <!-- Icon -->
  <div class="error-icon" [class]="getColorClass()">
    <svg
      width="64"
      height="64"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path [attr.d]="getIconPath()"></path>
    </svg>
  </div>

  <!-- Title -->
  <h3 class="error-title">{{ title() }}</h3>

  <!-- Message -->
  <p class="error-message">{{ message() }}</p>

  <!-- Actions -->
  <div class="error-actions">
    @if (showRetry()) {
      <button
        class="btn-primary"
        (click)="onRetry()"
        [disabled]="isRetrying()"
        type="button"
      >
        @if (isRetrying()) {
          <svg class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Chargement...</span>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>{{ retryLabel() }}</span>
        }
      </button>
    }

    @if (showHomeButton()) {
      <button
        class="btn-secondary"
        (click)="onGoHome()"
        type="button"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span>Retour à l'accueil</span>
      </button>
    }
  </div>

  <!-- Technical Details (collapsible) -->
  @if (technicalDetails()) {
    <details class="error-details" [open]="showDetails()">
      <summary (click)="toggleDetails(); $event.preventDefault()">
        <span>Détails techniques</span>
        <svg
          class="details-chevron"
          [class.rotated]="showDetails()"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </summary>
      <pre class="details-content">{{ technicalDetails() }}</pre>
    </details>
  }
</div>
