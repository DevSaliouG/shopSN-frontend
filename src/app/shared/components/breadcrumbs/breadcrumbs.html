<nav aria-label="Breadcrumb" class="breadcrumbs">
  <ol class="breadcrumbs-list">
    @for (item of displayItems; track item.label; let last = $last; let i = $index) {
      <li class="breadcrumbs-item" [class.active]="last">
        @if (!last && item.url) {
          <a [routerLink]="item.url" class="breadcrumbs-link">
            {{ item.label }}
          </a>
        } @else {
          <span class="breadcrumbs-current">{{ item.label }}</span>
        }
        @if (!last) {
          <span class="breadcrumbs-separator" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
