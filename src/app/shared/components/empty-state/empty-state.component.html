<div 
  [class]="containerClass()"
  class="flex flex-col items-center justify-center text-center bg-gray-50 rounded-2xl"
>
  <!-- Icône animée -->
  <div class="relative mb-4">
    <div class="empty-state-icon-bg absolute inset-0 bg-gradient-to-br from-green-100 to-green-50 rounded-full blur-2xl opacity-60"></div>
    <div class="relative">
      <div class="icon-wrapper">
        <svg
          [class]="iconSizeClass()"
          class="text-gray-400 animate-float"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <g [innerHTML]="iconPath()"></g>
        </svg>
      </div>
    </div>
  </div>
  
  <!-- Titre -->
  <h3 
    [class]="titleSizeClass()"
    class="font-semibold text-gray-900 mb-2"
  >
    {{ title() }}
  </h3>
  
  <!-- Message -->
  <p 
    [class]="messageSizeClass()"
    class="text-gray-500 max-w-sm mx-auto"
  >
    {{ message() }}
  </p>
  
  <!-- Bouton d'action -->
  @if (actionLabel() && showAction()) {
    <button
      (click)="onAction()"
      class="mt-6 inline-flex items-center gap-2 px-5 py-2.5 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-xl transition-all duration-200 shadow-sm hover:shadow-md active:scale-95"
    >
      @if (actionIcon()) {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          @switch (actionIcon()) {
            @case ('refresh') {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            }
            @case ('filter') {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
            }
            @case ('search') {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            }
            @default {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            }
          }
        </svg>
      }
      {{ actionLabel() }}
    </button>
  }
</div>
